name: Java verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Verify with tests
        working-directory: myhome
        run: bash ./mvnw --batch-mode verify
      - uses: actions/upload-artifact@v4
        with:
          name: application
          path: myhome/target/myhome-1.1.1.jar
