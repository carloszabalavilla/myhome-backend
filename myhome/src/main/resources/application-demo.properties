# Disposable, local-only demonstration. Never enable on a public host.
server.address=127.0.0.1
spring.datasource.url=jdbc:h2:mem:myhome;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
# New random signing key for each process, not a real credential.
security.jwt.secret-key=${random.value}${random.value}
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# Capture confirmation/recovery emails locally; never contact an SMTP account.
myhome.mail.local-directory=.runtime/mail
